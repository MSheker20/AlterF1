spring:
  application:
    name: alterf1
  mvc:
    problemdetails:
      enabled: true  # framework errors (missing param, bad path variable) as RFC 9457 too
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:alterf1}
    username: ${ALTERF1_RO_USER:alterf1_ro}
    password: ${ALTERF1_RO_PASSWORD:}
  flyway:
    user: ${POSTGRES_USER:alterf1}
    password: ${POSTGRES_PASSWORD:}
    schemas:
      - alterf1
    default-schema: alterf1
    create-schemas: true
    placeholders:
      # afterMigrate.sql grants SELECT on the views to the role the app connects as.
      roUser: ${spring.datasource.username}

alterf1:
  version: 0.0.1
  # Public origin for absolute link-preview URLs (e.g. https://alterf1.example). Empty locally: taken
  # from the request. Set it once the site is public, so request headers cannot change these URLs.
  public-origin: ${ALTERF1_PUBLIC_ORIGIN:}

server:
  port: 8080
  # Trust X-Forwarded-* from the dev proxy (and later the web server) so link previews get public URLs.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
