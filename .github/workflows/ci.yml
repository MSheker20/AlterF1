name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; every push to main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - uses: actions/cache@v5
        with:
          path: infra/f1db/.cache
          key: f1db-${{ hashFiles('infra/f1db/f1db.env') }}
      - name: Verify
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create local environment file
        run: |
          pg_pw="$(openssl rand -hex 16)"
          ro_pw="$(openssl rand -hex 16)"
          echo "::add-mask::${pg_pw}"
          echo "::add-mask::${ro_pw}"
          sed \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${pg_pw}/" \
            -e "s/^ALTERF1_RO_PASSWORD=.*/ALTERF1_RO_PASSWORD=${ro_pw}/" \
            infra/.env.example > infra/.env
          chmod 600 infra/.env
      - name: Start stack
        run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e
      - name: Dump compose logs
        if: failure()
        run: |
          if [ -f infra/.env ]; then
            docker compose -f infra/docker-compose.yml logs --no-color
          fi
      - name: Upload Playwright report and results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-e2e-artifacts
          path: |
            frontend/playwright-report/
            frontend/e2e-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: |
          if [ -f infra/.env ]; then
            docker compose -f infra/docker-compose.yml down -v
          fi
